<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>559 Mobile Repairs — Phone & Tablet Repair, Fresno</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ---------- Corporate Blue Palette ---------- */
:root{
  --ink:#0D1A2B;          /* deep navy */
  --ink-soft:#4A5A6A;     /* steel gray */
  --paper:#FFFFFF;        /* white */
  --panel:#F5F7FA;        /* light tech gray */
  --accent:#1E63FF;       /* corporate blue */
  --accent-soft:#AFC7FF;  /* soft blue */
  --border:#0D1A2B;       /* navy */
  --font-display:'Archivo Black','Space Grotesk',sans-serif;
  --font-body:'Space Grotesk',sans-serif;
}

/* ---------- Base ---------- */
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
}
.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 24px;
}
a{ color:inherit; text-decoration:none; }

/* ---------- Header ---------- */
header{
  padding:16px 0;
  border-bottom:2px solid var(--accent);
  background:var(--paper);
  position:sticky;
  top:0;
  z-index:20;
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  font-family:var(--font-display);
  font-size:20px;
}
.brand span{ color:var(--accent); }

nav.primary-nav{
  display:flex;
  gap:24px;
}
nav.primary-nav a{
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}

/* ---------- Buttons ---------- */
.btn{
  padding:10px 18px;
  font-size:14px;
  font-weight:700;
  border:2px solid var(--accent);
  border-radius:8px;
}
.btn-solid{
  background:var(--accent);
  color:#FFF;
}
.btn-outline{
  background:#FFF;
  color:var(--accent);
}

/* ---------- Hero ---------- */
.hero-inner{
  padding:64px 0 40px;
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  align-items:center;
  background:linear-gradient(135deg,#FFFFFF,#E9F0FF,#D6E4FF);
}
.hero-inner h1{
  font-family:var(--font-display);
  font-size:clamp(34px,5.4vw,56px);
  margin:0 0 20px;
}
.hero-inner mark{
  background:var(--accent);
  color:#FFF;
  padding:0 4px;
}
.hero-inner p.lede{
  font-size:17px;
  color:var(--ink-soft);
  margin:0 0 24px;
}

/* ---------- Trust Strip ---------- */
.trust-strip{
  padding:20px 0;
}
.trust-strip .wrap{
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  justify-content:space-between;
  font-size:13px;
  font-weight:700;
}
.trust-strip .dot{
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
}

/* ---------- Section Head ---------- */
.section-head{
  max-width:56ch;
  margin-bottom:28px;
}
.section-head .eyebrow{
  font-size:13px;
  font-weight:700;
  color:var(--accent);
}
.section-head h2{
  font-family:var(--font-display);
  font-size:clamp(26px,3.6vw,36px);
  margin:0 0 10px;
}
.section-head p{
  color:var(--ink-soft);
}

/* ---------- Services ---------- */
.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.service-card{
  background:var(--panel);
  border:2px solid var(--accent-soft);
  border-radius:10px;
  padding:20px;
  position:relative;
}
.service-card::before{
  content:"";
  position:absolute;
  top:-2px;
  left:-2px;
  width:10px;
  height:10px;
  background:var(--accent);
  border-radius:3px;
}
.service-card h3{
  font-family:var(--font-display);
  margin:0 0 8px;
}
.service-card p{
  color:var(--ink-soft);
}

/* ---------- Steps ---------- */
.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.step{
  background:var(--panel);
  border:2px solid var(--accent-soft);
  border-radius:10px;
  padding:18px;
}
.step .num{
  font-family:var(--font-display);
  font-size:32px;
  color:var(--accent);
}

/* ---------- Contact Section ---------- */
.contact-section{
  background:var(--accent);
  color:#FFF;
  padding:40px 0;
}
.contact-grid{
  display:grid;
  grid-template-columns:0.9fr 1.1fr;
  gap:32px;
}
.contact-info .label{
  font-size:11px;
  font-weight:700;
  color:#FFF;
}
.phone-big{
  font-family:var(--font-display);
  font-size:26px;
  color:#FFF;
}

/* ---------- Form ---------- */
.pmr-form-wrap{
  background:var(--panel);
  border:2px solid var(--accent);
  border-radius:12px;
  padding:24px;
}
.pmr-field{
  margin-bottom:14px;
}
label{
  font-size:12px;
  font-weight:700;
}
input,textarea{
  width:100%;
  padding:11px 12px;
  font-size:14px;
  border:1.5px solid var(--accent-soft);
  border-radius:8px;
  background:#FFF;
  color:var(--ink);
}
textarea{ min-height:80px; resize:vertical; }
input:focus,textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(30,99,255,0.25);
}
.pmr-submit{
  width:100%;
  background:var(--accent);
  color:#FFF;
  border:none;
  padding:14px 18px;
  font-size:15px;
  font-weight:700;
  border-radius:8px;
  cursor:pointer;
}
