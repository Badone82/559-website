<title>559 Mobile Repairs — Phone & Tablet Repair, Fresno</title>

/* ---------- Black & White Palette ---------- */
:root{
  --ink:#000000;
  --ink-soft:#444444;
  --paper:#FFFFFF;
  --panel:#F7F7F7;
  --accent:#000000;
  --accent-soft:#777777;
  --border:#000000;
  --font-display:'Archivo Black','Space Grotesk',sans-serif;
  --font-body:'Space Grotesk',sans-serif;
}

/* ---------- Base ---------- */
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
}
.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 24px;
}
a{ color:inherit; text-decoration:none; }

/* ---------- Header ---------- */
header{
  padding:16px 0;
  border-bottom:2px solid var(--border);
  background:var(--paper);
  position:sticky;
  top:0;
  z-index:20;
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  font-family:var(--font-display);
  font-size:20px;
}
.brand span{ color:var(--ink); }

nav.primary-nav{
  display:flex;
  gap:24px;
}
nav.primary-nav a{
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}

.header-cta{
  display:flex;
  gap:14px;
}
.btn{
  padding:10px 18px;
  font-size:14px;
  font-weight:700;
  border:2px solid var(--border);
  border-radius:8px;
}
.btn-solid{
  background:var(--ink);
  color:var(--paper);
}
.btn-outline{
  background:transparent;
  color:var(--ink);
}

/* ---------- Section Shell ---------- */
section{
  padding:32px 0;
}

/* ---------- Hero ---------- */
.hero-inner{
  padding:48px 0 32px;
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  align-items:center;
  background:var(--paper);
}
.hero-inner h1{
  font-family:var(--font-display);
  font-size:clamp(34px,5.4vw,56px);
  margin:0 0 20px;
}
.hero-inner mark{
  background:#000;
  color:#FFF;
  padding:0 4px;
}
.hero-inner p.lede{
  font-size:17px;
  color:var(--ink-soft);
  margin:0 0 24px;
}

/* ---------- Trust Strip ---------- */
.trust-strip{
  padding:20px 0;
}
.trust-strip .wrap{
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  justify-content:space-between;
  font-size:13px;
  font-weight:700;
}
.trust-strip .dot{
  width:8px;
  height:8px;
  background:#000;
  border-radius:50%;
}

/* ---------- Section Head ---------- */
.section-head{
  max-width:56ch;
  margin-bottom:28px;
}
.section-head .eyebrow{
  font-size:13px;
  font-weight:700;
  color:#000;
}
.section-head h2{
  font-family:var(--font-display);
  font-size:clamp(26px,3.6vw,36px);
  margin:0 0 10px;
}
.section-head p{
  color:var(--ink-soft);
}

/* ---------- Services ---------- */
.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.service-card{
  background:var(--panel);
  border:1.5px solid var(--border);
  border-radius:8px;
  padding:20px;
  position:relative;
}
.service-card::before{
  content:"";
  position:absolute;
  top:-2px;
  left:-2px;
  width:10px;
  height:10px;
  background:#000;
}
.service-card h3{
  font-family:var(--font-display);
  margin:0 0 8px;
}
.service-card p{
  color:var(--ink-soft);
}

/* ---------- Steps ---------- */
.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

  background:var(--panel);
  border:1.5px solid var(--border);
  border-radius:8px;
  padding:18px;
}
